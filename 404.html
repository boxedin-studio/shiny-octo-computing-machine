<script>

  var p=location.pathname.replace(/\/index\.html$/,'/').replace(/\.html$/,'').replace(/^\/+|\/+$/g,'');
  var to=map[p];
  if(!to){var m=p.match(/^projects(?:\/([^\/]+))?$/);if(m)to='/#'+(m[1]||'')}
  if(to)location.replace(to.indexOf('#')>-1&&to.charAt(0)==='/'?to:to+location.hash);
})();
</script>
