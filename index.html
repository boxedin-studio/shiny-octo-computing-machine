:root{
  --bg:#2f4bff; --fg:#ffffff;
  --pad:clamp(16px,2.2vw,32px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:"Aileron","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:clamp(14px,1.9vh,20px);line-height:1.25;letter-spacing:-.005em;
  text-transform:uppercase;
  font-weight:700;
  transition:background-color .45s ease,color .45s ease;
}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid currentColor;outline-offset:3px}

.page{
  position:relative;min-height:100svh;
  padding:calc(var(--pad) + env(safe-area-inset-top,0px)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;justify-content:space-between;gap:48px;
}

/* Top-left project list: first line sits level with the top of the logo */
.projects{list-style:none;margin:0;padding:0}
.projects a{display:inline-block;padding:1px 0}

/* Bottom-left info list */
.info{list-style:none;margin:0;padding:0}
.info a{display:inline-block;padding:1px 0}
.info a:hover{text-decoration:underline;text-underline-offset:4px}

/* Top-right logo placeholder: replace the div with <img src="..."> or inline <svg> */
.logo{position:absolute;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);width:clamp(110px,13vw,200px);aspect-ratio:630.27/236.55;display:block}
.logo [data-slot],.logo img,.logo svg{width:100%;height:100%;object-fit:contain;display:block}
[data-slot]{display:flex;align-items:center;justify-content:center;border:1.5px solid currentColor;font-size:.8em;letter-spacing:.08em}

@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>

<script>
(function(){
  var root=document.documentElement;
  var list=document.getElementById('projects');
  var base={bg:getComputedStyle(root).getPropertyValue('--bg').trim(),fg:getComputedStyle(root).getPropertyValue('--fg').trim()};
  function set(bg,fg){root.style.setProperty('--bg',bg);root.style.setProperty('--fg',fg)}
  list.querySelectorAll('a').forEach(function(a){
    var on=function(){set(a.dataset.bg,a.dataset.fg)};
    a.addEventListener('mouseenter',on);
    a.addEventListener('focus',on);
    a.addEventListener('touchstart',on,{passive:true});
  });
  var off=function(){set(base.bg,base.fg)};
  list.addEventListener('mouseleave',off);
  list.addEventListener('focusout',off);
})();
</script>
