<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Architecture and carpentry by Boxed In Studio.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boxed In Studio">
<meta property="og:title" content="Boxed In Studio">
<meta property="og:description" content="Architecture and carpentry by Boxed In Studio.">

<style>
@font-face{font-family:"Aileron";font-weight:400;font-style:normal;font-display:swap;src:url(aileron-regular.woff2) format("woff2")}
@font-face{font-family:"Aileron";font-weight:700;font-style:normal;font-display:swap;src:url(aileron-bold.woff2) format("woff2")}
:root{--bg:#2f4bff;--fg:#ffffff;--pad:clamp(16px,2.2vw,32px);box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Aileron","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:clamp(14px,1.9vh,20px);line-height:1.25;letter-spacing:-.005em;text-transform:uppercase;font-weight:700;transition:color .4s ease-in-out}
a{color:inherit;text-decoration:none;transition:opacity .35s ease}
.page a:not(.logo){opacity:.6}
.page a:not(.logo):hover,.page a:not(.logo):focus-visible,.page a.active,.page a.current{opacity:1}
html.logo-fade .logo{opacity:.6}
a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.page{position:relative;min-height:100svh;padding:calc(var(--pad) + env(safe-area-inset-top,0px)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.top{display:flex;flex-direction:column;gap:20px}
.tabs{display:flex;gap:1.5em}
.tabs a{display:inline-block;padding:4px 0}
[hidden]{display:none!important}
.projects{display:grid}
.projects a{display:inline-block;padding:4px 0}
.info{list-style:none;margin:0;padding:0}
.info a{display:inline-block;padding:1px 0}
.logo{position:absolute;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);width:312px;aspect-ratio:623.62/257.95;display:block;background-color:currentColor;-webkit-mask:url(boxed-in-logo.svg) center/contain no-repeat;mask:url(boxed-in-logo.svg) center/contain no-repeat}
.logo [data-slot],.logo img,.logo svg{width:100%;height:100%;object-fit:contain;display:block}
[data-slot]{display:flex;align-items:center;justify-content:center;border:1.5px solid currentColor;font-size:.8em;letter-spacing:.08em}
/* At narrower widths, move the logo into the page flow so it never overlaps the project list. */
@media (max-width:900px){.page{justify-content:flex-start;gap:28px}.logo{position:static;order:-1;width:min(312px,70vw);align-self:flex-start}.info{margin-top:auto}}
@media (max-width:623px){.logo{width:min(312px,100%);align-self:center}}
html{overflow-x:hidden;background:var(--bg)}
@keyframes pan-out{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
.page{animation:pan-out 1.3s cubic-bezier(.16,.8,.24,1) .2s both}

/*
  PROJECT-LIST ANIMATION (rows fade and drop in one after another; the old list fades out at the same time)
  Close: the old list fades out at once (--row-out-time), without moving, so its words clear before the new ones appear.
  Open: after --open-delay, rows drop in --row-in-step apart, each taking --row-in-time. Keep the numbers in the script (rowOutStep, rowOutTime) the same as the CSS ones.
*/
:root{--open-delay:110ms;--row-in-step:35ms;--row-in-time:300ms;--row-out-step:0ms;--row-out-time:150ms}
.group{grid-area:1/1;list-style:none;margin:0;padding:0;visibility:hidden;pointer-events:none}
.group.open{visibility:visible;pointer-events:auto}
.group.closing{pointer-events:none}
.group.opening li{animation:row-in var(--row-in-time) cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--open-delay) + var(--i)*var(--row-in-step))}
.group.closing li{animation:row-out var(--row-out-time) linear both;animation-delay:calc(var(--i)*var(--row-out-step))}
@keyframes row-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes row-out{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){body,a{transition:none}.page,.group li{animation:none!important}}
</style>
</head>
<body>
<div class="page">
  <a class="logo" href="index.html" aria-label="Boxed In home"></a>
  <div class="top">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Project categories"></nav>
    <div class="projects" id="projects"></div>
  </div>
  <ul class="info">
    <li><a href="#">archive</a></li>
    <li><a href="#">studio</a></li>
    <li><a href="#">journal</a></li>
    <li><a href="tel:+642102963024"><strong>+64 21 029 63024</strong></a></li>
    <li><a href="mailto:harry@boxedin.studio"><strong>harry@boxedin.studio</strong></a></li>
  </ul>
</div>
<script src="projects.js"></script>
<script>
(function(){
  var S=window.SITE||{mediums:[],projects:[]};
  var tabs=document.getElementById('tabs'),list=document.getElementById('projects');
  var groups={};
  S.mediums.forEach(function(m){
    var a=document.createElement('a');a.href='#'+m.id;a.dataset.tab=m.id;a.setAttribute('role','tab');a.setAttribute('aria-controls','projects');a.textContent=m.label;tabs.appendChild(a);
    var ul=document.createElement('ul');ul.className='group';ul.dataset.tab=m.id;ul.setAttribute('aria-label',m.label+' projects');ul.setAttribute('aria-hidden','true');list.appendChild(ul);groups[m.id]=ul;
  });
  S.projects.forEach(function(p){
    var ul=groups[p.medium];if(!ul)return;
    var li=document.createElement('li');li.style.setProperty('--i',ul.children.length);
    var a=document.createElement('a');a.href=p.id+'.html';a.dataset.bg=p.color;a.textContent=p.name;li.appendChild(a);ul.appendChild(li);
  });
})();
</script>
<script>
(function(){
  var root=document.documentElement;
  var list=document.getElementById('projects');
  var base={bg:getComputedStyle(root).getPropertyValue('--bg').trim()};
  function parse(h){h=h.trim().replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)/255})}
  function lin(c){return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)}
  function gam(c){return c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055}
  function toLab(c){var r=lin(c[0]),g=lin(c[1]),b=lin(c[2]);var l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);return [.2104542553*l+.7936177850*m-.0040720468*s,1.9779984951*l-2.4285922050*m+.4505937099*s,.0259040371*l+.7827717662*m-.8086757660*s]}
  function toHex(L){var l=L[0]+.3963377774*L[1]+.2158037573*L[2],m=L[0]-.1055613458*L[1]-.0638541728*L[2],s=L[0]-.0894841775*L[1]-1.2914855480*L[2];l=l*l*l;m=m*m*m;s=s*s*s;var c=[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.7076147010*s];return '#'+c.map(function(v){v=Math.round(255*Math.min(1,Math.max(0,gam(Math.max(0,v)))));return (v<16?'0':'')+v.toString(16)}).join('')}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var meta=document.querySelector('meta[name="theme-color"]');
  // Keep Safari's theme colour in sync with the actual page colour.
  function setBg(c){root.style.setProperty('--bg',c);document.body.style.backgroundColor=c;if(meta)meta.setAttribute('content',c)}
  var curLab=toLab(parse(base.bg)),target=base.bg.toLowerCase(),raf=0;
  function fadeTo(hex){hex=hex.toLowerCase();if(hex===target)return;target=hex;var A=curLab.slice(),B=toLab(parse(hex)),t0=null,dur=300;cancelAnimationFrame(raf);function paint(p){var e=-(Math.cos(Math.PI*p)-1)/2,k1=e<.5?1-2*e:0,k2=e<.5?0:2*e-1;curLab=[A[0]+(B[0]-A[0])*e,A[1]*k1+B[1]*k2,A[2]*k1+B[2]*k2];setBg(toHex(curLab))}if(reduce){curLab=B;setBg(hex);return}function step(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur);paint(p);if(p<1)raf=requestAnimationFrame(step);else setBg(hex)}raf=requestAnimationFrame(step)}
  var active=null;
  function set(bg,a){fadeTo(bg||base.bg);root.classList.toggle('logo-fade',!!(bg&&a));if(active)active.classList.remove('active');active=a||null;if(active)active.classList.add('active')}
  list.querySelectorAll('a').forEach(function(a){var on=function(){set(a.dataset.bg,a)};a.addEventListener('mouseenter',on);a.addEventListener('focus',on);a.addEventListener('touchstart',on,{passive:true})});
  var off=function(){set(base.bg,null)};
  list.addEventListener('mouseleave',off);list.addEventListener('focusout',function(e){if(!list.contains(e.relatedTarget))off()});
  var info=document.querySelector('.info');
  info.querySelectorAll('a').forEach(function(a){var on=function(){set(null,a)};a.addEventListener('mouseenter',on);a.addEventListener('focus',on);a.addEventListener('touchstart',on,{passive:true})});
  info.addEventListener('mouseleave',off);info.addEventListener('focusout',function(e){if(!info.contains(e.relatedTarget))off()});

  var tabs=document.getElementById('tabs');
  var tabLinks=Array.prototype.slice.call(tabs.querySelectorAll('a'));
  var groups={};
  Array.prototype.forEach.call(list.querySelectorAll('.group'),function(g){groups[g.dataset.tab]=g});
  var current=null;
  var rowOutStep=0,rowOutTime=150; // keep the same as --row-out-step and --row-out-time in the CSS
  function markTab(name){tabLinks.forEach(function(t){var on=t.dataset.tab===name;t.classList.toggle('current',on);t.setAttribute('aria-selected',on?'true':'false');t.setAttribute('tabindex',on?'0':'-1')})}
  // Line each list up under its own tab, and size the block to the open list
  function align(){
    tabLinks.forEach(function(t){var g=groups[t.dataset.tab];if(g)g.style.marginLeft=Math.max(0,t.offsetLeft-list.offsetLeft)+'px'});
    if(current&&groups[current])list.style.height=groups[current].offsetHeight+'px';
  }
  function openGroup(g){
    clearTimeout(g._t);
    g.classList.remove('closing','opening');void g.offsetWidth;
    g.classList.add('open');
    if(!reduce)g.classList.add('opening');
    g.removeAttribute('aria-hidden');
  }
  function closeGroup(g){
    if(!g.classList.contains('open')||g.classList.contains('closing'))return;
    g.classList.remove('opening');
    g.setAttribute('aria-hidden','true');
    if(reduce){g.classList.remove('open');return}
    g.classList.add('closing');
    g._t=setTimeout(function(){g.classList.remove('open','closing')},(g.children.length-1)*rowOutStep+rowOutTime+40);
  }
  // Opening one list and closing the other happen at the same moment
  function show(name){
    if(!groups[name])name=tabLinks[0].dataset.tab;
    if(name===current)return name;
    current=name;markTab(name);
    Object.keys(groups).forEach(function(k){if(k!==name)closeGroup(groups[k])});
    openGroup(groups[name]);
    align();
    return name;
  }
  // Keep the list hidden during the page intro, then open the first tab
  var initialName=tabLinks.some(function(t){return t.dataset.tab===location.hash.slice(1)})?location.hash.slice(1):tabLinks[0].dataset.tab;
  markTab(initialName);align();
  window.setTimeout(function(){if(current===null)show(initialName)},1500);
  window.addEventListener('resize',align);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(align);
  tabLinks.forEach(function(t,index){
    var on=function(){set(null,t)};t.addEventListener('mouseenter',on);t.addEventListener('focus',on);t.addEventListener('touchstart',on,{passive:true});
    t.addEventListener('click',function(e){e.preventDefault();history.replaceState(null,'','#'+show(t.dataset.tab))});
    t.addEventListener('keydown',function(e){var nextIndex=null;if(e.key==='ArrowRight')nextIndex=(index+1)%tabLinks.length;else if(e.key==='ArrowLeft')nextIndex=(index+tabLinks.length-1)%tabLinks.length;else if(e.key==='Home')nextIndex=0;else if(e.key==='End')nextIndex=tabLinks.length-1;if(nextIndex!==null){e.preventDefault();tabLinks[nextIndex].focus();show(tabLinks[nextIndex].dataset.tab)}});
  });
  tabs.addEventListener('mouseleave',off);tabs.addEventListener('focusout',function(e){if(!tabs.contains(e.relatedTarget))off()});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
})();
</script>
</body>
</html>
