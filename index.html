<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxed In Studio</title>
<style>
@font-face{font-family:"Aileron";font-weight:400;font-style:normal;font-display:swap;src:url(aileron-regular.woff2) format("woff2")}
@font-face{font-family:"Aileron";font-weight:700;font-style:normal;font-display:swap;src:url(aileron-bold.woff2) format("woff2")}
:root{
  --bg:#2f4bff; --fg:#ffffff;
  --pad:clamp(16px,2.2vw,32px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:"Aileron","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:clamp(14px,1.9vh,20px);line-height:1.25;letter-spacing:-.005em;
  text-transform:uppercase;
  font-weight:700;
  transition:background-color .45s ease,color .45s ease;
}
a{color:inherit;text-decoration:none;transition:opacity .35s ease}
/* While a project is hovered, white text stays white but dims slightly; the hovered project stays full */
html.dimmed .page a:not(.active){opacity:.6}
a:focus-visible{outline:2px solid currentColor;outline-offset:3px}

.page{
  position:relative;min-height:100svh;
  padding:calc(var(--pad) + env(safe-area-inset-top,0px)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;justify-content:space-between;gap:48px;
}

/* Top-left project list: first line sits level with the top of the logo */
.projects{list-style:none;margin:0;padding:0}
.projects a{display:inline-block;padding:4px 0}

/* Bottom-left info list */
.info{list-style:none;margin:0;padding:0}
.info a{display:inline-block;padding:1px 0}

/* Top-right logo placeholder: replace the div with <img src="..."> or inline <svg> */
.logo{position:absolute;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);width:312px;aspect-ratio:623.62/257.95;display:block}
.logo{background-color:currentColor;-webkit-mask:url(boxed-in-logo.svg) center/contain no-repeat;mask:url(boxed-in-logo.svg) center/contain no-repeat}
.logo [data-slot],.logo img,.logo svg{width:100%;height:100%;object-fit:contain;display:block}
[data-slot]{display:flex;align-items:center;justify-content:center;border:1.5px solid currentColor;font-size:.8em;letter-spacing:.08em}

/* Below twice the logo width (624px): logo is centred and stacked on top of the projects list */
@media (max-width:623px){
  .page{justify-content:flex-start;gap:28px}
  .logo{position:static;order:-1;width:min(312px,100%);align-self:center}
  .info{margin-top:auto}
}

@media (prefers-reduced-motion:reduce){body,a{transition:none}}
</style>
</head>
<body>
<div class="page">

  <a class="logo" href="#" aria-label="Boxed In home"></a>

  <ul class="projects" id="projects">
    <li><a href="whananaki-residence.html" data-bg="#f2a7c3">whananaki residence</a></li>
    <li><a href="ply-table.html" data-bg="#f0d58a">ply table</a></li>
    <li><a href="totara-desktop.html" data-bg="#9fd3b4">totara desktop</a></li>
    <li><a href="chopping-board.html" data-bg="#f3b49b">chopping board</a></li>
    <li><a href="misc-carpentry.html" data-bg="#b9b4d9">misc carpentry</a></li>
    <li><a href="project-name-1.html" data-bg="#9fd9d3">project name</a></li>
    <li><a href="project-name-2.html" data-bg="#c3b5ee">project name</a></li>
  </ul>

  <ul class="info">
    <li><a href="#">archive</a></li>
    <li><a href="#">studio</a></li>
    <li><a href="#">journal</a></li>
    <li><a href="tel:+642102963024"><strong>+64 21 029 63024</strong></a></li>
    <li><a href="mailto:harry@boxedin.studio"><strong>harry@boxedin.studio</strong></a></li>
  </ul>

</div>

<script>
(function(){
  var root=document.documentElement;
  var list=document.getElementById('projects');
  var base={bg:getComputedStyle(root).getPropertyValue('--bg').trim()};
  var active=null;
  function set(bg,a){root.style.setProperty('--bg',bg||base.bg);
    if(active)active.classList.remove('active');
    active=a||null;
    if(active){active.classList.add('active');root.classList.add('dimmed')}else root.classList.remove('dimmed')}
  list.querySelectorAll('a').forEach(function(a){
    var on=function(){set(a.dataset.bg,a)};
    a.addEventListener('mouseenter',on);
    a.addEventListener('focus',on);
    a.addEventListener('touchstart',on,{passive:true});
  });
  var off=function(){set(base.bg,null)};
  list.addEventListener('mouseleave',off);
  list.addEventListener('focusout',off);

  // Bottom-left info links: same dim-the-rest focus effect, background stays blue
  var info=document.querySelector('.info');
  info.querySelectorAll('a').forEach(function(a){
    var on=function(){set(null,a)};
    a.addEventListener('mouseenter',on);
    a.addEventListener('focus',on);
    a.addEventListener('touchstart',on,{passive:true});
  });
  info.addEventListener('mouseleave',off);
  info.addEventListener('focusout',off);
})();
</script>
</body>
</html>
