<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7d7562">
<title>Mangawhai House — Boxed In Studio</title>
<style>
@font-face{font-family:"Aileron";font-weight:400;font-style:normal;font-display:swap;src:url(aileron-regular.woff2) format("woff2")}
@font-face{font-family:"Aileron";font-weight:700;font-style:normal;font-display:swap;src:url(aileron-bold.woff2) format("woff2")}
:root{--bg:#7d7562;--fg:#fff;--pad:clamp(16px,2.2vw,32px);box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--fg);font-family:"Aileron","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:clamp(14px,1.9vh,20px);line-height:1.25;letter-spacing:-.005em;text-transform:uppercase;font-weight:700}
a{color:inherit;text-decoration:none;opacity:.65;transition:opacity .25s ease}
a:hover,a:focus-visible{opacity:1}
a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.page{position:relative;min-height:100svh;padding:calc(var(--pad) + env(safe-area-inset-top,0px)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:clamp(40px,10vh,100px)}
.logo{position:absolute;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);width:min(312px,38vw);aspect-ratio:623.62/257.95;display:block;background-color:currentColor;-webkit-mask:url(boxed-in-logo.svg) center/contain no-repeat;mask:url(boxed-in-logo.svg) center/contain no-repeat}
.back{display:inline-block;width:max-content;font-weight:400}
.back span{position:relative;display:inline-block;padding-bottom:3px}
.back span:after{content:"";position:absolute;left:0;bottom:0;height:1.5px;width:100%;background:currentColor;transform:scaleX(.25);transform-origin:left;transition:transform .45s ease}
.back:hover span:after,.back:focus-visible span:after{transform:scaleX(1)}
.project-title{margin:0;max-width:12ch;font-size:clamp(2rem,8vw,6rem);line-height:.98;font-weight:700;letter-spacing:-.045em}
@media(max-width:900px){.page{gap:28px}.logo{position:static;order:-1;width:min(312px,70vw)}.project-title{margin-top:clamp(24px,8vh,80px)}}
@media(max-width:623px){.logo{width:min(312px,100%);align-self:center}}
@media(prefers-reduced-motion:reduce){a,.back span:after{transition:none}}
</style>
</head>
<body>
<main class="page">
  <a class="logo" href="index.html" aria-label="Boxed In home"></a>
  <a class="back" href="index.html"><span>back to projects</span></a>
  <h1 class="project-title">mangawhai house</h1>
</main>
</body>
</html>
