<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f4bff">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<title>Page not found — Boxed In Studio</title>
<link rel="stylesheet" href="/assets/css/project.css">
<script>
/* Old and mistyped addresses are sent to the right page. The list is written by build.js. */
(function(){
  var map={{REDIRECTS}};
  var p=location.pathname.replace(/\/index\.html$/,'/').replace(/\.html$/,'').replace(/^\/+|\/+$/g,'');
  var to=map[p];
  if(!to){var m=p.match(/^projects(?:\/([^\/]+))?$/);if(m)to='/#'+(m[1]||'')}
  if(to)location.replace(to.indexOf('#')>-1&&to.charAt(0)==='/'?to:to+location.hash);
})();
</script>
</head>
<body>
<main class="page">
  <a class="logo" href="/" aria-label="Boxed In home"></a>
  <a class="back ul" href="/"><span>back to home</span></a>
  <h1 class="project-title">page not found</h1>
  <div id="project-body">
    <div class="desc"><p>That page doesn't exist. Try the home page to find a project.</p></div>
  </div>
</main>
</body>
</html>
